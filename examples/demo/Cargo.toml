[package]
name = "dioxus-cropper-demo"
version = "0.0.0"
edition = "2021"
publish = false

# `dx serve` selects the platform feature: `--platform web` (the default)
# or `--platform desktop`.
[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document", "asset", "devtools"] }
dioxus-cropper = { path = "../.." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
# `requestAnimationFrame` for the paint-before-block yield in `paint.rs`;
# `Blob`/`URL.createObjectURL` for the object URLs in `object_url.rs`.
web-sys = { version = "0.3", features = ["Window", "Blob", "BlobPropertyBag", "Url"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
