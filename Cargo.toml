[package]
name = "dioxus-cropper"
version = "0.0.2"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "A host-agnostic, pure-Rust image cropper component for Dioxus."
repository = "https://github.com/mze-runner/dioxus-cropper"
keywords = ["dioxus", "image", "crop", "component", "wasm"]
categories = ["gui", "multimedia::images", "wasm"]
exclude = [".github", ".gitignore", "examples"]

[workspace]
members = [".", "examples/demo"]
default-members = ["."]

# No renderer feature is enabled; the consuming application selects one.
[dependencies.dioxus]
version = "0.7"
default-features = false
features = ["macro", "html", "signals", "hooks"]

# `rayon` is off. Per-format features are named explicitly.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "webp"]

[dev-dependencies]
dioxus-ssr = "0.7"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
